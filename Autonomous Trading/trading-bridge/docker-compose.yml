version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: bridge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Placeholder for the bridge core engine, to be built out in future phases
  # bridge_core:
  #   build: .
  #   container_name: bridge_core
  #   depends_on:
  #     - redis
  #   env_file:
  #     - .env
  #   restart: unless-stopped

volumes:
  redis_data:
